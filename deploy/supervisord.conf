[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
command=node /app/backend/src/index.js
directory=/app/backend
autostart=true
autorestart=true
environment=
    BACKEND_PORT="3001",
    AI_SERVICE_PORT="8766",
    DATA_DIR="/data/samvaad",
    NODE_ENV="production"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ai]
command=python -u /app/services/ai/main.py
directory=/app/services/ai
autostart=true
autorestart=true
environment=
    AI_SERVICE_PORT="8766",
    WHISPER_MODEL="base.en",
    WHISPER_DEVICE="cpu"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
