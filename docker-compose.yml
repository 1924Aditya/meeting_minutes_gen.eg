services:
  ai:
    build:
      context: .
      dockerfile: deploy/ai.Dockerfile
    env_file:
      - .env
    environment:
      AI_SERVICE_HOST: 0.0.0.0
      AI_SERVICE_PORT: 8766
    expose:
      - "8766"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      BACKEND_PORT: 3001
      AI_WS_URL: ws://ai:8766
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      DATA_DIR: /data
    ports:
      - "3001:3001"
    volumes:
      - samvaad-data:/data
    depends_on:
      - ai
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      args:
        VITE_BACKEND_WS_URL: ${VITE_BACKEND_WS_URL:-ws://localhost:3001/ws}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  samvaad-data:
